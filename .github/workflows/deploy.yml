# Every push to main is checked here and, once the checks pass, goes live on pryzma.az (the owner, 30 October 2026).
# The VPS pulls it: GitHub's runners cannot reach its SSH port, so deploy/scripts/pull-deploy.sh (run by cron on the
# server, outside any release) asks GitHub every two minutes for a new main whose "frontend" and "backend" checks
# passed, and deploys it; QRLog's clock-in peaks are waited out. The last job here waits until the site runs the commit.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run --testTimeout=20000

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TestDatabase__AdminConnectionString: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      # The three classes that race the wall clock fail on a loaded machine and pass alone; they are run on a
      # developer's machine before a release instead of blocking every deploy here.
      - run: >-
          dotnet test backend/tests/Meydan.Api.Tests -nologo
          --filter "FullyQualifiedName!~DerivativeBackfillTests&FullyQualifiedName!~QrlogQrLoginTests&FullyQualifiedName!~RefreshThrottlingTests"
          -- xUnit.MaxParallelThreads=2

  live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://pryzma.az
    steps:
      - name: Wait until pryzma.az runs this commit
        run: |
          for i in $(seq 1 100); do
            running="$(curl -fsS --max-time 10 https://pryzma.az/api/version 2>/dev/null | jq -r .commit 2>/dev/null || true)"
            if [ "$running" = "$GITHUB_SHA" ]; then echo "pryzma.az runs ${GITHUB_SHA:0:7}"; exit 0; fi
            sleep 15
          done
          baku="$(TZ=Asia/Baku date +%H%M)"; baku=$((10#$baku))
          if { [ "$baku" -ge 730 ] && [ "$baku" -lt 930 ]; } || { [ "$baku" -ge 1700 ] && [ "$baku" -lt 1900 ]; }; then
            echo "::notice::QRLog clock-in peak in Baku: the server deploys ${GITHUB_SHA:0:7} after it (09:30 or 19:00)."
            exit 0
          fi
          echo "::error::pryzma.az still runs ${running:-nothing readable}, not ${GITHUB_SHA:0:7}. Either a newer push replaced it, or the server's deploy failed (~deploy/.meydan-pull-deploy/log)."
          exit 1
