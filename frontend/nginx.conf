# Production nginx for the MEYDAN SPA: static bundle + the /api and /health proxies to the API container.
#
# Public traffic reaches this container through the VPS's reverse proxy (the QRLog stack's Caddy, which terminates
# HTTPS and sets HSTS). Everything below assumes exactly that: X-Forwarded-Proto is fixed to https, and the client
# address arrives in X-Forwarded-For from a proxy that strips whatever the client sent in it.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # No directory listings, ever.
    autoindex off;

    # Vite emits no source maps here (build.sourcemap = false); refuse any that end up in the image anyway.
    location ~ \.map$ {
        return 404;
    }

    # Uploaded files are never static content: they live outside this container and are served only by the API,
    # after its authorisation checks. Nothing here answers under that name — not even the SPA shell.
    location /uploads/ {
        return 404;
    }

    # No API explorer in production (the API only mounts it in Development); keep the path from falling through.
    location /swagger {
        return 404;
    }

    # --- API upstream -------------------------------------------------------------------------
    # meydan-api exists only on this project's private network. Resolved at request time (the container's
    # address changes on recreate) and by its project-unique alias, never a generic "api".
    resolver 127.0.0.11 valid=10s;
    set $api_upstream meydan-api:8080;

    # The whole API. The API sets its own security headers, its own body limits (2 MB, 11.5 MB for the two upload
    # endpoints) and its own rate limits — nginx only forwards. 12m leaves room for the largest permitted upload
    # request; anything bigger is refused here with 413 before it reaches the API.
    location /api/ {
        client_max_body_size 12m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/meydan-proxy.conf;
    }

    # /health/live and /health/ready: status and check names only, nothing sensitive (see the API's README).
    location /health {
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/meydan-proxy.conf;
    }

    # --- static bundle ------------------------------------------------------------------------
    # Hashed build output: the file name changes with the content, so it may be cached for a year.
    location /assets/ {
        include /etc/nginx/meydan-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the SPA (deep links resolve to index.html for the client-side router). HTML must
    # revalidate so a deploy reaches people who already have the site open.
    location / {
        include /etc/nginx/meydan-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
