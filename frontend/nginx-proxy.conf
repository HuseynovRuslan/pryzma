# Proxy headers for every location that forwards to the API (included explicitly by nginx.conf).
proxy_http_version 1.1;
proxy_set_header Host $host;
# The edge proxy (Caddy) replaces any X-Forwarded-For a client sent with the real client address, so it is
# passed through unchanged — never appended to — and the API, which trusts only its private network as a
# proxy, reads the rightmost entry as the client.
proxy_set_header X-Forwarded-For $http_x_forwarded_for;
# This container is only ever reached behind HTTPS.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";
